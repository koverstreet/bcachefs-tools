[package]
name = "bcachefs-cstruct-macros"
version = "0.1.0"
authors = [ "Kent Overstreet <kent.overstreet@linux.dev>" ]
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "cstruct_macros"
proc-macro = true

# The kernel/DKMS build compiles this with a plain rustc, against the vendored
# syn, quote and proc-macro2 (os/linux_kernel/vendor).
[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
