[package]
name = "bcachefs-cstruct-macros"
version = "0.1.0"
authors = [ "Kent Overstreet <kent.overstreet@linux.dev>" ]
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "cstruct_macros"
proc-macro = true

# Deliberately zero dependencies (no syn/quote): the kernel/DKMS build compiles
# this with a plain `rustc --crate-type proc-macro src/lib.rs`, as it does
# typeinfo-macros. Its parser is fs/types/cstruct.rs, include!d.
[dependencies]
