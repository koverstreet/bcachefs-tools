[package]
name = "bcachefs-kernel"
version = "0.1.0"
authors = [ "Kent Overstreet <kent.overstreet@linux.dev>" ]
edition = "2024"
rust-version = "1.85.0"

[lib]
crate-type = ["lib"]
path = "mod.rs"

[features]
# `std` pulls in the userspace-only helpers (path/OsStr conversions). On by
# default for the tools build; the in-kernel build uses --no-default-features
# to get a no_std crate.
default = ["std"]
# `zeroize` is a userspace crate; the in-kernel build (no_std, no crates.io)
# wipes key material with a hand-rolled volatile memset instead (see mod.rs).
std = ["dep:zeroize"]

[dependencies]
bcachefs-shim = { path = "../os/linux_user/shim" }
# The kernel build has pin_init as a crate too - --extern pin_init, the
# kernel's or the vendored stack's: #[pin_data] and pin_init!() expand to
# ::pin_init paths.
pin-init = { path = "../os/linux_user/shim/pin-init" }
bcachefs-cstruct-macros = { path = "cstruct-macros" }
bitfield-struct = { path = "vendor/bitfield-struct" }
nestify = { path = "vendor/nestify" }
bitflags = { path = "vendor/bitflags" }
num-traits = { path = "vendor/num-traits", default-features = false }
paste    = { path = "vendor/paste" }
# Userspace only: std's legacy-mangled names, in backtraces. v0 names are
# util/demangle.rs's, and in the kernel every Rust name is v0
rustc-demangle = "0.1.27"
uuid     = "1.2.2"
# The target's ioctl number layout (util/ioctl.rs) and errnos (errcode.rs):
# bindgen output of each architecture's own headers. Userspace only - the
# kernel build has no crates.io.
linux-raw-sys = { version = "0.12", default-features = false, features = ["errno", "general", "no_std"] }
# Endian-typed integers for the on-disk format: byteorder::{little,big}_endian.
zerocopy = "0.8"
# Aligned boxes, for IO buffers: util/alloc.rs's ABox. Userspace only - the
# kernel build has its own, the same API over kvmalloc.
aligned-vec = "0.6"
# Userspace only, util/prompt's: asking on the terminal - polled, echo off
# for a passphrase - or through systemd's password agents; and the shim's
# scheduler's futexes and gettid() (os/linux_user/sched.rs).
rustix   = { version = "1.1.4", features = ["event", "fs", "termios", "thread"] }
# Userspace only: os/linux_user/percpu.rs's per-thread chunks, mmap()ed, and
# the pthread key whose destructor gives a thread's back when it exits.
libc     = "0.2.69"
# Userspace only: os/linux_user/blkdev.rs's IO.
io-uring = "0.7"
# Userspace only: os/linux_user/stacktrace.rs's unwinding and symbols.
backtrace = "0.3"
# Userspace only: os/linux_user/crc.rs's crc32c(), in hardware on x86 and arm64.
crc32c   = "0.6"
# Userspace only: os/linux_user/rwsem.rs's rw_semaphore.
parking_lot = "0.12"
owo-colors = "4"
log      = { version = "0.4", features = ["std"] }
zeroize  = { version = "1", optional = true, features = ["std", "zeroize_derive"] }
