[package]
name = "bcachefs-kernel"
version = "0.1.0"
authors = [ "Kent Overstreet <kent.overstreet@linux.dev>" ]
edition = "2024"
rust-version = "1.89.0"

[lib]
crate-type = ["lib"]
path = "mod.rs"

[[bench]]
name = "raid"
harness = false

[features]
# `std` pulls in the userspace-only helpers (path/OsStr conversions). On by
# default for the tools build; the in-kernel build uses --no-default-features
# to get a no_std crate.
default = ["std"]
# `zeroize` is a userspace crate; the in-kernel build (no_std, no crates.io)
# wipes key material with a hand-rolled volatile memset instead (see mod.rs).
std = ["dep:zeroize", "dep:linux-keyutils"]

# The dependencies the module builds too (Makefile.rust), from the sources
# cargo has: install_dkms copies them (dkms/install.rs).
[package.metadata.dkms]
crates = ["bitfield-struct", "bitflags", "g2gen", "g2p", "g2p-kernels", "g2poly", "nestify", "num-traits", "paste", "stable_deref_trait", "uuid", "yoke"]

[dependencies]
bcachefs-shim = { path = "../os/linux_user/shim" }
# The kernel build has pin_init as a crate too - --extern pin_init, the
# kernel's or the vendored stack's: #[pin_data] and pin_init!() expand to
# ::pin_init paths.
pin-init = { path = "../os/linux_user/shim/pin-init" }
bcachefs-cstruct-macros = { path = "cstruct-macros" }
bitfield-struct = "0.13"
nestify = { git = "https://github.com/koverstreet/nestify.git", rev = "49f93fbf42c10d7bffe502f0e51287a0a4e767ad" }
bitflags = "2.11"
num-traits = { version = "0.2.19", default-features = false }
paste    = "1.0.15"
# Userspace only: std's legacy-mangled names, in backtraces. v0 names are
# util/demangle.rs's, and in the kernel every Rust name is v0
rustc-demangle = "0.1.27"
uuid     = "1.2.2"
# The target's ioctl number layout (util/ioctl.rs) and errnos (errcode.rs):
# bindgen output of each architecture's own headers. Userspace only.
linux-raw-sys = { version = "0.12", default-features = false, features = ["errno", "general", "no_std"] }
# Endian-typed integers for the on-disk format: byteorder::{little,big}_endian.
zerocopy = "0.8"
# Its derives, by their own crate's name, as the kernel has them: FromZeros
# and FromBytes for an RcuArray's elements.
zerocopy-derive = "0.8"
# An owner and a value borrowed from it, together - no alloc: carts of our own.
# yoke's stable_deref_trait is ours.
yoke = { version = "0.8.4", default-features = false }
stable_deref_trait = { version = "1.2.1", default-features = false }
# GF(2^8), and buffers multiplied by matrices of it: a stripe's parity.
g2p = { git = "https://github.com/koverstreet/g2p.git", branch = "bcachefs" }
# Userspace only: os/linux_user/kernel.rs's random_bytes(), the OS's CSPRNG.
getrandom = "0.4"
# Userspace only, util/prompt's: asking on the terminal - polled, echo off
# for a passphrase - or through systemd's password agents; and the shim's
# scheduler's futexes and gettid() (os/linux_user/sched.rs), and its clocks
# (os/linux_user/kernel.rs).
rustix   = { version = "1.1.4", features = ["event", "fs", "mm", "system", "termios", "thread", "time"] }
# Userspace only: os/linux_user/blkdev.rs's preadv()/pwritev2(), and
# stacktrace.rs's signal and symbol lookups.
libc     = "0.2.69"
# Userspace only: os/linux_user/blkdev.rs's IO.
io-uring = "0.7"
# Userspace only: os/linux_user/stacktrace.rs's unwinding and symbols.
backtrace = "0.3"
# Userspace only: os/linux_user/checksum.rs's crc32c(), in hardware on x86 and arm64.
crc32c   = "0.6"
# Userspace only: os/linux_user/checksum.rs's Xxh64.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
# Userspace only: os/linux_user/crypto.rs's ChaCha20, Poly1305 and SHA-256.
chacha20 = { version = "0.10", features = ["zeroize"] }
poly1305 = { version = "0.9", features = ["zeroize"] }
sha2     = { version = "0.11", default-features = false }
# Userspace only: data/checksum.rs's derive_passphrase().
scrypt   = { version = "0.12", default-features = false }
# Userspace only: os/linux_user's Mutex, RwSem and PercpuRwSem.
parking_lot = "0.12"
owo-colors = "4"
log      = { version = "0.4", features = ["std"] }
zeroize  = { version = "1", optional = true, features = ["std", "zeroize_derive"] }
# The keyring the passphrase key is looked for in (os/linux_user/keyring.rs):
# the kernel's in-kernel, these syscalls here.
linux-keyutils = { version = "0.2", optional = true }
