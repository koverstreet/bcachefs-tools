[package]
name = "bcachefs-kernel"
version = "0.1.0"
authors = [ "Kent Overstreet <kent.overstreet@linux.dev>" ]
edition = "2021"
rust-version = "1.85.0"

[lib]
crate-type = ["lib"]
path = "mod.rs"

[features]
# `std` pulls in the userspace-only helpers (path/OsStr conversions). On by
# default for the tools build; the in-kernel build uses --no-default-features
# to get a no_std crate.
default = ["std"]
# `zeroize` is a userspace crate; the in-kernel build (no_std, no crates.io)
# wipes key material with a hand-rolled volatile memset instead (see mod.rs).
std = ["dep:zeroize"]

[dependencies]
bcachefs-shim = { path = "../bcachefs-shim" }
# The kernel build has pin_init as a crate too - --extern pin_init, the
# kernel's or the vendored stack's: #[pin_data] and pin_init!() expand to
# ::pin_init paths.
pin-init = { path = "../bcachefs-shim/pin-init" }
bcachefs-cstruct-macros = { path = "cstruct-macros" }
bitfield-struct = { path = "vendor/bitfield-struct" }
nestify = { path = "vendor/nestify" }
bitfield = { path = "vendor/bitfield" }
bitflags = { path = "vendor/bitflags" }
num-traits = { path = "vendor/num-traits", default-features = false }
arrayvec = { path = "vendor/arrayvec", default-features = false }
paste    = { path = "vendor/paste" }
uuid     = "1.2.2"
# The target's ioctl number layout (util/ioctl.rs): bindgen output of each
# architecture's own headers. Userspace only - the kernel build has no
# crates.io.
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "no_std"] }
# Endian-typed integers for the on-disk format: byteorder::{little,big}_endian.
zerocopy = "0.8"
zeroize  = { version = "1", optional = true, features = ["std", "zeroize_derive"] }
