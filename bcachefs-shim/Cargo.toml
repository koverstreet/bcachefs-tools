[package]
name = "bcachefs-shim"
version = "0.1.0"
authors = [ "Kent Overstreet <kent.overstreet@linux.dev>" ]
edition = "2024"
rust-version = "1.85.0"

[lib]
crate-type = ["lib"]
# sync::aref's examples are the kernel's, written against kernel::
doctest = false

[dependencies]
pin-init = { path = "pin-init" }

[build-dependencies]
pkg-config = "0.3"
bindgen = "0.72.1"
cc = "1.0"
